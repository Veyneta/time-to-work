services:
  - type: web
    name: time-to-work
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: time-to-work-db
          property: connectionString

databases:
  - name: time-to-work-db
    databaseName: time_to_work
    user: time_to_work
    plan: free